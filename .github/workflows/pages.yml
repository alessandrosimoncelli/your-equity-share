# Refresh the market data every week, check it, build the site, publish it.
#
# The built site is not in the repository. .gitignore excludes /web/ so that
# what is tracked is the source, and the page a reader opens is produced from
# it rather than committed beside it. That means something has to run the
# build, and this is it.
#
# THREE TRIGGERS, ONE PIPELINE.
#
#   A push to main publishes the code and data exactly as committed.
#   Every Monday the data is refreshed first, then the same pipeline runs.
#   "Run workflow" on the Actions tab does the Monday run on demand.
#
# The gate runs before anything is published and the deploy needs it. This
# project has already published a page that could not load: every test passed,
# because nothing had ever opened a built file. Deploying without the checks
# would rebuild that same hole in a place where nobody is watching, and a
# scheduled run is precisely a place where nobody is watching.
#
# WHY THE REFRESHED DATA IS COMMITTED BACK. GitHub switches off the schedule of
# any public repository with no new commits for sixty days. A portfolio project
# can easily sit untouched for longer than that, and the site would freeze on
# whatever week it stopped, which is the failure this workflow exists to end.
# Committing the refreshed files is real activity rather than a trick: the
# data genuinely changed, and the history becomes a record of what the tool
# said each week. Tools that fake activity to dodge the rule have been taken
# down by GitHub, so this one does not. Set COMMIT_REFRESHED_DATA to "false"
# to publish without committing, and accept the sixty-day rule instead.

name: Refresh and publish

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 05:17 UTC. Off the hour on purpose: the top of the hour is
    # when GitHub's scheduler is busiest, and runs queued then are the ones
    # that get delayed or dropped.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A queued run is not cancelled, because cancelling it
# would leave the site on an older build than the newest green one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  COMMIT_REFRESHED_DATA: "true"

jobs:
  build:
    name: Refresh, check and build
    runs-on: ubuntu-latest
    # Naming any permission here sets every one not named to none, so pages:
    # read is spelled out for configure-pages, which reads the site's
    # settings. GitHub's own starter workflow grants it to every job.
    permissions:
      contents: write   # only to commit the refreshed data back
      pages: read       # for configure-pages
    outputs:
      us: ${{ steps.us.outcome }}
      it: ${{ steps.it.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit step rebases, which needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The model has no runtime dependencies. pytest runs the checks, and
      # certifi is used by the refresh scripts when present.
      - name: Install the test runner
        run: python -m pip install --upgrade pip pytest certifi

      # Which sources answer GitHub's servers today. The refresh stops at the
      # first source that fails, which hides every source after it; this asks
      # all twelve at once and puts the answer on the summary page. It only
      # reports, so it can never fail the run.
      - name: Check which data sources answer
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/probe_sources.py

      # continue-on-error so that a refresh which fails still lets the run go
      # on to republish the last good data, and the report job at the end
      # turns the run red so the failure is not missed.
      #
      # And it says WHY, on the run's summary page. Step logs are shown only
      # to signed-in users, but annotations are public, so the reason a
      # source refused goes into one: the line the script printed naming the
      # source and the error, or failing that its last lines. A % would be
      # read as an escape in a workflow command, so it is escaped first.
      - name: Refresh the American market data
        id: us
        if: github.event_name != 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if ! python update.py 2>&1 | tee "$RUNNER_TEMP/refresh-us.log"; then
            reason=$(grep -iE "could not|refus|http [0-9]{3}|timed out|not found|unavailable" "$RUNNER_TEMP/refresh-us.log" | tail -n 3 | tr '\n' ' ')
            [ -n "$reason" ] || reason=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/refresh-us.log" | tail -n 3 | tr '\n' ' ')
            echo "::error title=American refresh failed::$(printf '%s' "$reason" | sed 's/%/%25/g')"
            exit 1
          fi

      - name: Refresh the Italian market data
        id: it
        if: github.event_name != 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if ! python tools/refresh_italy.py --write 2>&1 | tee "$RUNNER_TEMP/refresh-it.log"; then
            reason=$(grep -iE "could not|refus|http [0-9]{3}|timed out|not found|unavailable|too few" "$RUNNER_TEMP/refresh-it.log" | tail -n 3 | tr '\n' ' ')
            [ -n "$reason" ] || reason=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/refresh-it.log" | tail -n 3 | tr '\n' ' ')
            echo "::error title=Italian refresh failed::$(printf '%s' "$reason" | sed 's/%/%25/g')"
            exit 1
          fi

      # ALL OR NOTHING. Both variants take real growth from the same Shiller
      # trend and a test holds them equal to five decimals, so one refreshed
      # file beside one stale file is a state the checks rightly reject. If
      # either refresh failed, both files go back to what is committed, and
      # the Shiller workbook the American refresh saved early is removed too,
      # which leaves the checks exactly where a plain push would run them.
      - name: Keep the two variants consistent
        if: >-
          github.event_name != 'push' &&
          (steps.us.outcome != 'success' || steps.it.outcome != 'success')
        run: |
          echo "American refresh: ${{ steps.us.outcome }}"
          echo "Italian refresh:  ${{ steps.it.outcome }}"
          echo "A refresh did not complete. Publishing the committed data."
          git checkout -- variants/
          rm -f data/shiller.xls data/shiller.csv

      - name: Tests
        run: python -m pytest -q

      - name: JavaScript against Python
        run: node tools/check_golden.mjs

      # Part four compares against Choi's spreadsheet, which is his and not
      # in the repository, so it skips here and does not fail the run.
      - name: Verifier
        run: python tools/verify_model.py

      # After the checks, never before: data that fails them is never
      # committed. Only the two market data files are staged, so nothing else
      # the run produced can slip into the history.
      - name: Commit the refreshed data
        if: >-
          github.event_name != 'push' &&
          env.COMMIT_REFRESHED_DATA == 'true' &&
          steps.us.outcome == 'success' &&
          steps.it.outcome == 'success'
        run: |
          git add variants/us/market_data.toml variants/it/market_data.toml
          if git diff --cached --quiet; then
            echo "The data did not change this week; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh market data, week of $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build
        run: python tools/build_web.py

      # Catches the exact defect that took the live site down: the build
      # wrapping model.js in a document shell, so the browser parsed
      # JavaScript as HTML and the page hung on "Loading the market data."
      # tests/test_build_output.py checks this too; it is repeated here
      # because this is the copy that actually gets published.
      - name: The published files are what they claim to be
        run: |
          set -e
          for f in index.html methodology.html it/methodology.html \
                   further-work.html model.js market.json; do
            test -f "web/$f" || { echo "missing: web/$f"; exit 1; }
          done
          if head -c 200 web/model.js | grep -qi 'doctype'; then
            echo "model.js was wrapped in an HTML document; the browser will"
            echo "parse it as HTML and the page will never finish loading."
            exit 1
          fi
          python -c "import json; json.load(open('web/market.json'))"
          grep -q '<!doctype html>' web/index.html
          echo "the published files are present and well formed"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish
      id-token: write   # to prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5, as in GitHub's own starter workflow for a static site; the
      # other Pages actions above are the versions that workflow uses too.
      - id: deployment
        uses: actions/deploy-pages@v5

  # A refresh that failed has already been handled safely above: the site
  # was republished on its last good data. This job exists so that the run
  # still ends red and GitHub emails the owner, because a refresh that fails
  # quietly every week is how the site went stale in the first place.
  report:
    name: Say so if a refresh failed
    needs: [build, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "American refresh: ${{ needs.build.outputs.us }}"
          echo "Italian refresh:  ${{ needs.build.outputs.it }}"
          if [ "${{ needs.build.outputs.us }}" != "success" ] || \
             [ "${{ needs.build.outputs.it }}" != "success" ]; then
            echo "::error::A market data refresh failed. The site kept its previous data."
            exit 1
          fi
          echo "Both refreshes succeeded."
