[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "your-equity-share"
version = "1.1.0"
description = "Equity allocation from the Merton share and a human capital multiplier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://alessandrosimoncelli.github.io/your-equity-share/"
Repository = "https://github.com/alessandrosimoncelli/your-equity-share"

[project.optional-dependencies]
# Nothing here has runtime dependencies: not the model, not the refresh
# script, not the browser build. The extras are the test runner and numpy,
# which only the Italian tax check (tools/tax_check.py) uses.
dev = ["pytest>=8", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
