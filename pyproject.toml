[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "your-equity-share"
version = "0.1.0"
description = "Equity allocation from the Merton share and a human capital multiplier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Nothing here has runtime dependencies: not the model, not the refresh
# script, not the browser build. The only extra is the test runner.
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
