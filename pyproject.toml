[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merton-share"
version = "0.1.0"
description = "Equity allocation from the Merton share and a human capital multiplier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The model and the refresh script have no runtime dependencies.
# Streamlit is needed only for the browser front end.
app = ["streamlit>=1.30", "pandas>=2.0", "altair>=5.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
