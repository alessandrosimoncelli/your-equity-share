after_tax_source = "Italy taxes government bonds of Italy and of white-list states, Germany included, at 12.5% and other financial income at 26%, both on nominal income so inflation is taxed, plus 0.2% a year of imposta di bollo on the value of each. Equities are taxed once on sale, so the tax is deferred over 30 years, which recovers more than the higher rate costs. The volatility is NOT reduced, because Italian law does not let fund losses offset fund gains. Tax costs 1.06 points of expected return and 0.66 points of safe rate, so 0.36 points of the drift. See src/your_equity_share/taxes.py."
