# Market data for the Italian variant of Your Equity Share.
#
# This file is NOT refreshed by update.py. That script rebuilds a whole
# configuration from one American template, and running it here once already
# replaced this file's expected return and safe rate with United States ones
# and dropped the provenance saying which were provisional. It now refuses,
# on the `variant` field below.
#
# Three things differ from config/market_data.toml, and one large thing does
# not.
#
# The EQUITY SLEEVE is global rather than the S&P 500, because a euro investor
# buying a home index would hold about 1% of world market capitalisation.
# FTSE All-World, through VWCE, is the accumulating UCITS share class most
# European retail investors actually hold.
#
# The EXPECTED RETURN is AQR's published figure for Global All Country,
# refreshed once a year when they publish it in January. Both of its halves are
# checked against free data on every run of tools/refresh_italy.py, and the
# field says what those checks currently return.
#
# The SAFE ASSET is the ECB's AAA euro area government curve at thirty years,
# deflated by the ECB Survey of Professional Forecasters. What matters about it
# is CONSTANT MATURITY: it describes a thirty-year horizon at every refresh,
# which is the property FRED's DFII30 has and a particular bond cannot.
#
# TAX IS MODELLED, because in Italy it is not a household's circumstance but a
# fixed feature of the law that falls on exactly these two assets and favours
# the safe one: 12.5% on government bonds against 26% on everything else. The
# rates and the reasoning are in src/your_equity_share/taxes.py.
#
# The REPLACEMENT RATE is 74% rather than 40%, from the OECD. It is the only
# constant in the human capital half that can honestly be made Italian, and it
# is set in ITALY_CALIBRATION rather than here.
#
# The HUMAN CAPITAL CALIBRATION is otherwise still American: Cocco, Gomes and
# Maenhout's earnings profile and shock volatilities, and United States
# mortality, are fitted inside Choi's coefficients and cannot be changed from
# a configuration file. That is the largest declared deviation of this variant.
#
# EVERY NUMBER HERE IS NOW MEASURED. The file shipped with a safe rate and a
# volatility somebody had reasoned about; both have since been measured, and
# provisional_fields below is empty. It exists so that if a guess is ever
# added back it has to declare itself, and tests/test_italy.py checks that the
# field is honest in both directions.
#
# EVERYTHING IS IN EURO, and one term of one input needs an argument for it
# rather than an assertion.
#
# The volatility is measured on a euro-priced series, so it carries the
# currency risk an unhedged global fund gives a euro investor without anything
# further being done to it. The safe rate is a euro curve deflated by euro
# inflation expectations. Neither is in question.
#
# The expected return is the exception. AQR publish LOCAL real returns: each
# market in its own currency, deflated by its own inflation, cap-weighted. The
# reason that figure can be read as a euro real return is the one they give
# themselves, in the same report: "one simple assumption is that relative
# purchasing power is preserved, which implies the expected spot currency
# return is equal to the expected inflation differential. Under this
# assumption, expected real returns are the same regardless of currency."
#
# That is an assumption, not a measurement, and it is the weakest link in this
# configuration. It is defensible over a lifetime, which is the horizon this
# tool works at, because real exchange rates mean-revert over decades. It is
# not defensible over five years. A euro investor holding an unhedged world
# fund can and does experience real currency losses for long stretches, and
# nothing in the model represents that.
#
# One half of it is checkable in euro directly, and it checks out. The trailing
# dividend yield of MSCI All Country World priced in EURO is measured on every
# refresh and currently sits a tenth of a point from AQR's quoted figure, so
# the currency assumption is not doing visible damage to the income term.

[meta]
generated_at = "2026-09-08T00:00:00+00:00"
generated_by = "hand, from the sources named below"

[market]

# AQR's expected real return for Global All Country equities, refreshed once
# a year when they publish, in January, as of the previous 31 December.
#   dividend yield         0.0160
#   real EPS growth        0.0260
#   repricing              0.0000   ratios held constant, stated
#   compound               0.0420
#   volatility             0.138942
#   arithmetic             0.052107   + volatility drag
#
# That is equation (5) of the methodology term for term, from the one firm that
# publishes every component and states the zero. Section 8.3 of the American
# methodology checks their US figure against the same report.
#
# ANNUAL IS THE RIGHT CADENCE, and not merely the convenient one. No firm
# publishes this decomposition more often. The houses that update quarterly or
# monthly all assume valuations revert towards a fair value, which is a
# different estimator: on United States large cap the same table has GMO at
# minus 6.0% and Research Affiliates at 0.73% against AQR's 3.9%, and that
# spread is the repricing assumption rather than new information. Switching to
# one of them for the sake of freshness would change the method rather than
# refresh the number.
#
# SO THE HALVES ARE CHECKED INSTEAD, on every run of tools/refresh_italy.py,
# against data that costs nothing. The dividend yield is measured from MSCI's
# own index levels, since the gross index reinvests dividends and the price
# index does not, so the gap between their monthly returns is that month's
# dividend over the price at the start of it. The growth rate is checked
# against the American variant's hundred-year Shiller trend. If either drifts
# more than a third of a point the report says so, which is the signal to go
# and read AQR's current report rather than wait for January.
#
# The measured yield is recorded below as dividend_yield_measured. It is a
# check and not the input: replacing one half of a firm's internally consistent
# estimate with our own measurement would leave a figure that is neither.
#
# It is measured GROSS of withholding tax, because Shiller's dividend column is
# gross and the American variant divides that, so the two variants have to
# measure one thing one way. Withholding costs 0.379 points, recorded below as
# dividend_yield_withheld, and an American holding domestic stock pays none of
# it. That is a real cost of a global sleeve which this model does not
# represent, and it is written down rather than netted off, because netting it
# into a market return would hide a tax inside a price.
expected_stock_real_return = 0.052107

# The ECB's AAA euro area government curve at thirty years, deflated by the
# longer-term HICP expectation in the ECB Survey of Professional Forecasters.
#
# WHAT MATTERS ABOUT IT IS CONSTANT MATURITY. FRED's DFII30, which the American
# variant reads, is not a bond: it is the thirty-year point read off the TIPS
# curve every day, so it describes the same horizon at every refresh. A yield
# curve does that. A particular bond cannot.
#
# This file used the traded real yield of Bund/euro-i 2046 until September
# 2026, on the argument that a traded real yield is the same kind of object as
# DFII30. That matched the wrong property. The 2046 is one bond with 19.6 years
# left and one fewer every year, so within a decade it would have been quoting
# a fifteen-year horizon while this file still called it the thirty-year rate.
# Holding the horizon fixed is worth more than avoiding a survey, because the
# model prices a lifetime.
#
# The traded bond is still fetched and reported as the cross-check, and the two
# bracket the answer. The traded yield is biased low, by scarcity and by being
# a decade short of thirty years. The deflated one is biased high, because the
# gap between the market breakeven and the survey expectation is an inflation
# risk premium and deflating books it as return.
#
# AAA rather than all euro area government bonds, which yield 0.61 points more
# at the same maturity. That spread is compensation for a government not
# paying, equation (4) cannot represent default risk, and booking it as a
# risk-free return would raise this rate and lower the recommendation while
# looking prudent. An Italian household buying BTP is NOT holding this asset.
#
# It is euro area HICP, not Italian. An Italian household's cost of living is
# Italian, and only BTP Italia tracks that, at five years and retail. So the
# deflator is approximate in a way an American's TIPS is not.
real_risk_free = 0.016904

# Measured: five years of daily dividend-adjusted closes of VWCE.DE to
# 3 September 2026, annualised. Lower than the 17.18% of the S&P 500 sleeve,
# which is what diversifying across a world index is supposed to do, and it
# already carries the currency exposure a euro investor takes on an unhedged
# global fund, because the series is priced in euro.
stock_volatility = 0.138942
market_ticker = "VWCE.DE"

as_of = 2026-09-08

