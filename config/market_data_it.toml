# Market data for the Italian variant of Your Equity Share.
#
# This file is NOT refreshed by update.py. That script rebuilds a whole
# configuration from one American template, and running it here once already
# replaced this file's expected return and safe rate with United States ones
# and dropped the provenance saying which were provisional. It now refuses,
# on the `variant` field below.
#
# Three things differ from config/market_data.toml, and one large thing does
# not.
#
# The EQUITY SLEEVE is global rather than the S&P 500, because a euro investor
# buying a home index would hold about 1% of world market capitalisation.
# FTSE All-World, through VWCE, is the accumulating UCITS share class most
# European retail investors actually hold.
#
# The SAFE ASSET is the AAA-rated euro area government curve at thirty years,
# deflated by euro inflation expectations, rather than a 30-year TIPS. Both
# halves of that choice are argued at the field itself below. In short: AAA
# because the extra 0.61 points on the all-government curve is credit risk the
# model cannot represent, and deflated because the euro area has no liquid
# long index-linked market to read a real yield from.
#
# The REPLACEMENT RATE is 74% rather than 40%, from the OECD. It is the only
# constant in the human capital half that can honestly be made Italian, and it
# is set in ITALY_CALIBRATION rather than here.
#
# The HUMAN CAPITAL CALIBRATION is otherwise still American: Cocco, Gomes and
# Maenhout's earnings profile and shock volatilities, and United States
# mortality, are fitted inside Choi's coefficients and cannot be changed from
# a configuration file. That is the largest declared deviation of this variant.
#
# EVERY NUMBER HERE IS NOW MEASURED. The file shipped with a safe rate and a
# volatility somebody had reasoned about; both have since been measured, and
# provisional_fields below is empty. It exists so that if a guess is ever
# added back it has to declare itself, and tests/test_italy.py checks that the
# field is honest in both directions.
#
# EVERYTHING IS IN EURO, and one of the three needs an argument for it rather
# than an assertion.
#
# The volatility is measured on a euro-priced series, so it carries the
# currency risk an unhedged global fund gives a euro investor without anything
# further being done to it. The safe rate is a euro yield deflated by euro
# inflation expectations. Neither is in question.
#
# The expected return is AQR's, and they publish LOCAL real returns: each
# market in its own currency, deflated by its own inflation, cap-weighted. The
# reason that figure can be read as a euro real return is the one they give
# themselves, in the same report: "one simple assumption is that relative
# purchasing power is preserved, which implies the expected spot currency
# return is equal to the expected inflation differential. Under this
# assumption, expected real returns are the same regardless of currency."
#
# That is an assumption, not a measurement, and it is the weakest link in this
# configuration. It is defensible over a lifetime, which is the horizon this
# tool works at, because real exchange rates mean-revert over decades. It is
# not defensible over five years. A euro investor holding an unhedged world
# fund can and does experience real currency losses for long stretches, and
# nothing in the model represents that.

[meta]
generated_at = "2026-09-08T00:00:00+00:00"
generated_by = "hand, from the sources named below"

[market]

# AQR's expected real return for Global All Country equities as of
# 31 December 2025: a 1.6% dividend yield plus 2.6% real EPS growth, with no
# repricing assumed. That is equation (5) of the methodology term for term,
# from the one firm that publishes every component, and section 8.3 of the
# American methodology checks their US figure against that same report.
#   compound        0.0420
#   volatility      0.1389
#   arithmetic      0.052107
expected_stock_real_return = 0.052107

# Measured. The AAA-rated euro area government spot rate at thirty years,
# deflated by the ECB Survey of Professional Forecasters' longer-term HICP
# expectation. tools/refresh_italy.py fetches both and does the arithmetic.
#
# AAA rather than all euro area government bonds, which at the same maturity
# yield 0.61 points more. That 0.61 is compensation for a government not
# paying, and equation (4) has no way to represent default risk, so booking it
# as a risk-free return would raise this rate and lower the recommendation
# while looking prudent. An Italian household buying BTP is therefore NOT
# holding the asset this rate describes, and is taking a credit risk the model
# does not price.
#
# Deflated rather than read directly, because the euro area has no liquid long
# index-linked market to read it from: German linkers stopped being issued in
# 2023 with four bonds outstanding, and the HICP-linked bonds that remain are
# Italian and French, which carry exactly the credit spread the AAA choice
# just excluded. The cost is that the deflator is a survey rather than a
# traded price.
real_risk_free = 0.017125

# Measured: five years of daily dividend-adjusted closes of VWCE.DE to
# 3 September 2026, annualised. Lower than the 17.18% of the S&P 500 sleeve,
# which is what diversifying across a world index is supposed to do, and it
# already carries the currency exposure a euro investor takes on an unhedged
# global fund, because the series is priced in euro.
stock_volatility = 0.138942
market_ticker = "VWCE.DE"

as_of = 2026-09-08

[provenance]
variant = "it"
provisional_fields = ""
expected_return_method = "building blocks, global"
expected_return_basis = "arithmetic mean, converted from compound"
expected_return_compound = 0.042000
expected_return_source = "AQR, Alternative Thinking 2026 Issue 1, Exhibit 3A, Global All Country, as of 31 December 2025: a 1.6% dividend yield plus 2.6% real EPS growth, no repricing"
dividend_yield = 0.016
real_growth = 0.026
currency_basis = "EUR. The volatility is measured on a euro-priced series and the safe rate is a euro yield deflated by euro inflation expectations. The expected return is AQR's local real figure, read as a euro real figure on their own stated assumption that relative purchasing power is preserved, under which expected real returns are the same regardless of currency."
equity_index = "FTSE All-World"
real_risk_free_source = "ECB, AAA-rated euro area central government bond spot rate at 30 years, 3.7842% nominal on 2026-09-07, deflated by the longer-term HICP expectation of 2.0369% from the ECB Survey of Professional Forecasters, 2026-Q3"
volatility_source = "Yahoo daily closes of VWCE.DE, 5 years, dividend adjusted"
volatility_currency = "EUR, unhedged"
volatility_observations = 1254
replacement_rate_source = "OECD, Pensions at a Glance 2025, Italy country note: a net replacement rate of 74.0% for an average earner, against an OECD average of 63.2%"
retirement_age_source = "OECD, Pensions at a Glance 2025: statutory 67, early 64"
human_capital_calibration = "American apart from the replacement rate. Cocco, Gomes and Maenhout's earnings profile and shock volatilities, and United States mortality, are inside Choi's fitted coefficients and cannot be set from here."
