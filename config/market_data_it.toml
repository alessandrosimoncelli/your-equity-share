# Market data for the Italian variant of Your Equity Share.
#
# This file is NOT refreshed by update.py. That script rebuilds a whole
# configuration from one American template, and running it here once already
# replaced this file's expected return and safe rate with United States ones
# and dropped the provenance saying which were provisional. It now refuses,
# on the `variant` field below.
#
# Three things differ from config/market_data.toml, and one large thing does
# not.
#
# The EQUITY SLEEVE is global rather than the S&P 500, because a euro investor
# buying a home index would hold about 1% of world market capitalisation.
# FTSE All-World, through VWCE, is the accumulating UCITS share class most
# European retail investors actually hold.
#
# The EXPECTED RETURN is built here rather than taken from a firm, by the same
# three-term construction the American variant uses, so that the difference
# between a 38% American answer and an Italian one is the country rather than
# the method. Its yield is measured on a euro-priced global index and its
# growth term is the American estimator, which the field itself argues for.
#
# The SAFE ASSET is the longest outstanding euro inflation-linked government
# bond, traded, which is the same kind of object the American variant reads
# from FRED. The field itself argues the three compromises that come with it,
# the largest being that it runs 19.6 years rather than 30 because no longer
# euro linker exists.
#
# The REPLACEMENT RATE is 74% rather than 40%, from the OECD. It is the only
# constant in the human capital half that can honestly be made Italian, and it
# is set in ITALY_CALIBRATION rather than here.
#
# The HUMAN CAPITAL CALIBRATION is otherwise still American: Cocco, Gomes and
# Maenhout's earnings profile and shock volatilities, and United States
# mortality, are fitted inside Choi's coefficients and cannot be changed from
# a configuration file. That is the largest declared deviation of this variant.
#
# EVERY NUMBER HERE IS NOW MEASURED. The file shipped with a safe rate and a
# volatility somebody had reasoned about; both have since been measured, and
# provisional_fields below is empty. It exists so that if a guess is ever
# added back it has to declare itself, and tests/test_italy.py checks that the
# field is honest in both directions.
#
# EVERYTHING IS IN EURO, and one term of one input needs an argument for it
# rather than an assertion.
#
# The volatility is measured on a euro-priced series, so it carries the
# currency risk an unhedged global fund gives a euro investor without anything
# further being done to it. The safe rate is a euro government bond's own
# traded real yield. The dividend yield is measured on a euro-priced global
# index. None of the three is in question.
#
# The growth term is the exception. It is real growth in UNITED STATES earnings
# per share, the American variant's own hundred-year trend, used as the global
# real rate. Reading a dollar real growth rate as a euro real growth rate needs
# the assumption AQR state for exactly this purpose: "one simple assumption is
# that relative purchasing power is preserved, which implies the expected spot
# currency return is equal to the expected inflation differential. Under this
# assumption, expected real returns are the same regardless of currency."
#
# That is an assumption, not a measurement, and it remains the weakest link
# here. It is defensible over a lifetime, which is the horizon this tool works
# at, because real exchange rates mean-revert over decades. It is not
# defensible over five years. A euro investor holding an unhedged world fund
# can and does experience real currency losses for long stretches, and nothing
# in the model represents that.
#
# It is worth noting how much this narrowed. Until September 2026 the whole
# expected return was AQR's local real figure read as a euro one, so the
# assumption carried all 4.20% of it. It now carries 2.286% of 3.985%, and the
# other 1.699% is measured in euro.

[meta]
generated_at = "2026-09-08T00:00:00+00:00"
generated_by = "hand, from the sources named below"

[market]

# COMPUTED HERE, not borrowed. This variant used to take AQR's 4.20% whole,
# on the argument that no global equivalent of Shiller's series exists. That
# argument was half right, and the half that was wrong is this line.
#   dividend yield         0.016989   MSCI ACWI, euro, trailing twelve months
#   real growth per share  0.022860   100 year trend, Shiller
#   repricing              0.0000     ratios held constant, stated
#   compound               0.039849
#   volatility             0.138942
#   arithmetic             0.049934   + volatility drag
#
# THE YIELD IS MEASURED, from MSCI's own index levels rather than from anyone's
# forecast. The gross index reinvests dividends and the price index does not,
# so the gap between their monthly returns is that month's dividend over the
# price at the start of it, and twelve of those are a trailing yield. That is
# the same object the American variant divides: Shiller's dividend column over
# his price. AQR quote 1.6% for this index and the measurement says 1.699%, so
# the two agree to a tenth of a point.
#
# GROSS, not net of withholding tax, because Shiller's dividend column is gross
# and the two variants have to measure the same object. Withholding costs
# 0.379 points here and an American holding domestic stock pays none of it, so
# it is a real cost of a global sleeve that this model does not represent. It
# is recorded in the provenance rather than netted off, because netting it here
# would mix a tax into a market return and hide it.
#
# THE GROWTH TERM IS THE AMERICAN ONE, unchanged, and that is the deviation
# this line has to argue for. Three things support it.
#
# AQR publish both halves: 2.7% real EPS growth for United States large cap
# and 2.6% for Global All Country. A tenth of a point apart. The one firm that
# publishes both measures long-run growth as very nearly the same in each.
#
# That is what theory expects. Real growth in earnings per share is a return on
# retained capital net of share issuance, not a national characteristic, and
# nothing in a national border makes retained euros compound differently from
# retained dollars over a lifetime.
#
# And the alternative was tried and failed. tools/global_growth.py rebuilds
# global real dividend growth from 155 years of free data across eighteen
# countries, and the answer moves 4.5 points across weighting schemes that are
# equally defensible, against 0.25 points for this estimator. The reason is
# structural and is written up in that file: a fixed basket of countries is not
# an index, because an index reconstitutes and a basket cannot.
#
# What this borrows from AQR is therefore an argument, not a number, and the
# argument is checkable: it is their own two published figures.
expected_stock_real_return = 0.049934

# Measured, and it is a TRADED real yield rather than a constructed one.
#
# The American variant reads FRED's 30-year TIPS. Deflating a nominal curve by
# a survey would have been a different construction, and part of any gap
# between a 38% American answer and a 65% Italian one would then have been
# method rather than country. The Bund/euro-i 2046 is the euro analogue: a
# government real yield, traded, from an issuer that will pay. Worth 5.4
# points of equity share against the deflated figure, so it is a decision and
# not a detail.
#
# Three compromises come with it.
#
# It has 19.6 years to run, not 30, and shortens every year. Germany issued it
# in 2015 AS a 30-year bond and stopped issuing linkers entirely in 2023;
# three remain, maturing 2030, 2033 and 2046.
#
# That shortfall is nearly free TODAY, which is why the bond is still the
# right choice, and it is a measured claim rather than a hopeful one: the ECB
# AAA euro curve is flat past twenty years. 20Y 3.7769%, 25Y 3.8128%, 30Y
# 3.7842%, so twenty years to thirty is worth 0.007 points. Buying ten years
# of extra maturity would cost less than a basis point of yield.
#
# France is the alternative and was rejected on the same principle as Italy.
# It has twelve OAT euro-i outstanding, still issued, the longest maturing in
# July 2053, which is 26.9 years and a much better maturity match. But France
# is AA where Germany is AAA, and the spread between them is tens of basis
# points of credit compensation. Paying up to fix a shortfall the curve prices
# at 0.007 points would be booking credit risk as return to solve a problem
# that costs nothing.
#
# This will not hold forever. As the 2046 rolls down it becomes a fifteen and
# then a ten year bond with nothing to replace it, and at some point the
# shortfall stops being free. The rule then is to re-measure the slope, not to
# assume the answer.
#
# Scarcity biases the yield DOWN. 47 billion outstanding against persistent
# demand for euro safe assets, with no new supply.
#
# It is linked to euro area HICP, not Italian. An Italian household's cost of
# living is Italian, and only BTP Italia tracks that, at five years and retail.
# So the inflation hedge is approximate in a way an American's TIPS is not.
#
# The cross-check in the provenance brackets it. The traded yield is biased
# low by scarcity; the deflated AAA curve is biased high, because the market
# breakeven of 2.289% against the survey's 2.037% is an inflation risk premium
# and deflating books it as return. The truth is inside those 22 basis points.
#
# AAA rather than all euro area government bonds, which yield 0.61 points more
# at the same maturity. That spread is compensation for a government not
# paying, equation (4) cannot represent default risk, and booking it as a
# risk-free return would raise this rate and lower the recommendation while
# looking prudent. An Italian household buying BTP is NOT holding this asset.
real_risk_free = 0.014906

# Measured: five years of daily dividend-adjusted closes of VWCE.DE to
# 3 September 2026, annualised. Lower than the 17.18% of the S&P 500 sleeve,
# which is what diversifying across a world index is supposed to do, and it
# already carries the currency exposure a euro investor takes on an unhedged
# global fund, because the series is priced in euro.
stock_volatility = 0.138942
market_ticker = "VWCE.DE"

as_of = 2026-09-08

