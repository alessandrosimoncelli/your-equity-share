# Static market data for the equity allocation tool.
#
# Regenerate with: python tools/refresh_market_data.py --write
# The model reads this file and never fetches anything itself, so a
# demo cannot fail because a data provider is unavailable.
#
# forward_pe is entered by hand. No free source publishes forward
# earnings estimates, so those fields survive a refresh untouched and
# their age is reported instead.
#
# SEED FILE. Volatilities and forward P/E ratios are the values from the source
# spreadsheet. The correlation matrix has NOT been estimated: it is a flat 0.80
# placeholder, the figure used illustratively in docs/methodology.html Table 3.
# Run the refresh before drawing any conclusion from the covariance matrix.

[meta]
generated_at = "2026-06-02T00:00:00+00:00"
generated_by = "seeded by hand from the source spreadsheet"

[rates]
# Real rate, taken directly from a long-dated TIPS yield rather than derived as
# a nominal yield less an inflation expectation. Choi's user guide asks for the
# 30-year TIPS yield here.
real_risk_free = 0.010000
as_of = 2026-06-02
real_risk_free_source = "source spreadsheet: cell B9 less its hardcoded 2.5% inflation"

[covariance]
as_of = 2026-06-02
observations = 0
window_years = 0
frequency = "none"
trading_days_per_year = 252
source = "PLACEHOLDER, not estimated from data"
correlation = [
  [ 1.000000,  0.800000,  0.800000],
  [ 0.800000,  1.000000,  0.800000],
  [ 0.800000,  0.800000,  1.000000],
]

[[sleeve]]
label = "S&P 500"
ticker = "spy.us"
weight = 0.650000
volatility = 0.157500  # annualised, from daily price returns
forward_pe = 22.4  # hand-entered
forward_pe_as_of = 2026-06-02

[[sleeve]]
label = "MSCI exUS"
ticker = "vea.us"
weight = 0.280000
volatility = 0.152600  # annualised, from daily price returns
forward_pe = 12.0  # hand-entered
forward_pe_as_of = 2026-06-02

[[sleeve]]
