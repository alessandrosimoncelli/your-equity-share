# FROZEN. The market data variants/it/methodology.html was written with, kept so the document
# can be checked against the numbers it actually quotes. The tool reads
# market_data.toml, which refreshes; this file changes only when the
# document is rewritten against newer data. See variants/README.md.

# Market data for the Italian variant of Your Equity Share.
#
# This file is NOT refreshed by update.py. That script rebuilds a whole
# configuration from one American template, and running it here once already
# replaced this file's expected return and safe rate with United States ones
# and dropped the provenance saying which were provisional. It now refuses,
# on the `variant` field below.
#
# Three things differ from variants/us/market_data.toml, and one large thing does
# not.
#
# The EQUITY SLEEVE is global rather than the S&P 500, because a euro investor
# buying a home index would hold under 1% of world market capitalisation.
# FTSE All-World, through VWCE, is the accumulating UCITS share class most
# European retail investors actually hold.
#
# The EXPECTED RETURN is built here, by the construction variants/us/market_data.toml
# uses, because that construction carries no horizon and this model prices a
# lifetime. AQR's published figure is the cross-check rather than the estimate:
# it is a good number, and they state it is for five to ten years.
#
# The SAFE ASSET is the ECB's AAA euro area government curve at thirty years,
# deflated by the MARKET break-even inflation rate of the longest German linker.
# It clears three bars at once: constant maturity, no survey, and the same kind
# of object as FRED's DFII30. The field argues each of them.
#
# TAX IS NOT APPLIED, as in Choi, Liu and Liu, whose variables are "implicitly
# after-tax where relevant". Italian law taxes the two funds differently, 26%
# against 12.5% on the gain at sale, and a fund held for years is usually in
# gain when sold, so the tax takes a share of the risk as well as of the
# return. Measured sale by sale it lowers the right equity share by about a
# quarter for money sold at three years, by about a ninth at seven and by
# under a tenth from twelve, and ignoring it costs under two basis points a year. Italian methodology,
# section 8; tools/tax_check.py.
#
# The REPLACEMENT RATE is the Ragioneria Generale dello Stato's 66% of final
# net pay without TFR, for a private employee on the average wage retiring in
# 2050 at 66 years and 2 months (RGS 2025, Table 6.3.a), which is 61.4% of the
# wage with TFR the page asks for; 40% in the American variant. Like the rest
# of the human capital half, it is set in ITALY_CALIBRATION rather than here.
#
# The HUMAN CAPITAL CALIBRATION is an Italian private-sector employee:
# Daminato and Padula's earnings process (Table 7 of CSEF working paper 585,
# 2020; published 2024), estimated on the Bank of Italy's household survey,
# with the 66% pension. Mortality stays American,
# because it is inside Choi's fitted coefficients.
#
# EVERY NUMBER HERE IS MEASURED. The file shipped with a safe rate and a
# volatility somebody had reasoned about; both have since been measured, and
# provisional_fields below is empty. It exists so that if a guess is ever
# added back it has to declare itself, and tests/test_italy.py checks that the
# field is honest in both directions.
#
# EVERYTHING IS IN EURO, and one term of one input needs an argument for it
# rather than an assertion.
#
# The volatility is measured on a euro-priced index, so it carries the
# currency risk an unhedged global fund gives a euro investor without anything
# further being done to it. The safe rate is a euro curve deflated by a euro
# market break-even. Neither is in question, and neither contains an opinion.
#
# The dividend yield is measured on a euro-priced global index, so it is a euro
# figure by construction too.
#
# The growth term is the exception, and it is one term of three. It is real
# growth in UNITED STATES earnings per share, used as the global real rate.
# Reading a dollar real growth rate as a euro one needs the assumption AQR
# state for exactly this purpose: "one simple assumption is that relative
# purchasing power is preserved, which implies the expected spot currency
# return is equal to the expected inflation differential. Under this
# assumption, expected real returns are the same regardless of currency."
#
# That is an assumption, not a measurement, and it remains the weakest link
# here. It is defensible over a lifetime, which is the horizon this tool works
# at, because real exchange rates mean-revert over decades. It is not
# defensible over five years. A euro investor holding an unhedged world fund
# can and does experience real currency losses for long stretches, and nothing
# in the model represents that.

[meta]
generated_at = "2026-09-08T00:00:00+00:00"
generated_by = "hand, from the sources named below"

[market]

# BUILT HERE, by the construction variants/us/market_data.toml uses, because that
# construction carries no horizon and this model prices a lifetime.
#   the dividend yield of MSCI ACWI in euro, net of withholding, trailing
#   over today's price, compounded with the 100-year OLS trend of real
#   growth in earnings per share through Shiller, with zero repricing,
#   converted
#   to an arithmetic mean at the fixed volatility below.
#
# WHY NOT AQR'S PUBLISHED FIGURE, which this file used until September 2026 and
# which is still fetched and reported as the cross-check. Because they say what
# it is for, and it is not this:
#
#   "We present local real (inflation-adjusted) and nominal annual compound
#   rates of return for a horizon of 5 to 10 years. Over such intermediate
#   horizons, starting valuations tend to be useful inputs. For multi-decade
#   forecast horizons their impact is diluted, so theory and long-term
#   historical averages may matter more in judging expected returns."
#
# Both halves of their estimate are built to ten years rather than to thirty.
# The payout half uses "a country-specific estimate of next-10-year real EPS
# growth". The earnings half multiplies the cyclically adjusted earnings yield
# by 1 + (g x 5) explicitly "to account for earnings growth during the 10-year
# window". It is a good ten-year number being asked to do a different job.
#
# THIS CONSTRUCTION CARRIES NO HORIZON AT ALL. A current yield plus a long-run
# growth rate with no repricing is the same number at ten years or at thirty,
# because nothing in it is a forecast of when anything happens. That is the
# property a lifetime model needs, and it is why the two variants can now be
# read against each other: they differ by country, not by horizon and not by
# method.
#
# IT IS ALSO THE ONE THAT WINS AT THIRTY YEARS, measured rather than asserted.
# Table 7 of the American methodology backtests every candidate against the
# return that actually arrived, at ten, twenty and thirty years. This one has
# the lowest error at thirty, 2.25 against 3.31 for the trailing earnings
# yield, and LOSES at ten and twenty. The estimator that is right here is
# specifically the long-horizon one.
#
# THE YIELD IS MEASURED, from MSCI's own index levels. The gross index
# reinvests dividends and the price index does not, so the gap between their
# monthly returns is that month's dividend, and twelve of those over today's
# price are a trailing yield. Over TODAY's price, which is the denominator
# Shiller's column already has and therefore the one the American variant
# divides by: the three plausible denominators differ by a third of a point.
#
# NET of withholding tax. Withholding is taken at source before the dividend
# reaches the fund, so no Italian holder ever receives it: it is a property
# of the fund, like its price, not the household's own tax, which the model
# leaves out. The amount is recorded below as dividend_yield_withheld; an
# American holding domestic stock pays none, so the gross Shiller column is
# the same measurement there.
#
# THE GROWTH TERM IS THE AMERICAN ONE, unchanged, and that is the deviation
# this line has to argue for. AQR publish both halves themselves, 2.7% real EPS
# growth for United States large cap against 2.6% for Global All Country, a
# tenth of a point apart. Long-run real growth in earnings per share is a
# return on retained capital net of issuance, not a national characteristic.
# And the alternative was tried: tools/global_growth.py rebuilds it from 155
# years of data across eighteen countries and the answer moves 4.5 points
# across weighting schemes that are equally defensible.
#
# THE CHECK STILL RUNS. AQR's two halves are compared with ours on every
# refresh and both currently sit within a third of a point, which is a firm
# that does this for a living arriving at the same two numbers from their own
# data. tools/estimators_it.py sets the whole family side by side.
expected_stock_real_return = 0.049157

# The ECB's AAA euro area government curve at thirty years, deflated by the
# MARKET break-even inflation rate of the longest German inflation-linked bond.
#
# It took three tries to get here and each attempt failed a different test.
#
# CONSTANT MATURITY. FRED's DFII30, which the American variant reads, is not a
# bond: it is the thirty-year point read off the TIPS curve every day, so it
# describes the same horizon at every refresh. This file used the traded real
# yield of Bund/euro-i 2046 until September 2026, and that bond has 19.6 years
# left and one fewer every year, so within a decade it would have been quoting
# a fifteen-year horizon under a thirty-year label.
#
# NO SURVEY. The curve was then deflated by the ECB Survey of Professional
# Forecasters, which fixed the maturity and introduced an opinion. This tool
# holds measurements and trends, not views.
#
# THE SAME KIND OF OBJECT. DFII30 is a traded real yield. A nominal yield with
# a forecast subtracted is not the same thing, whatever number it produces.
#
# A break-even clears all three. It is the rate at which holding the linker and
# holding a nominal bond pay the same, so it is a PRICE rather than a forecast,
# and subtracting it from a nominal curve recovers a real yield.
#
# TWO CONVENTIONS ARE MATCHED FIRST. The ECB compounds its curve
# continuously, so the par yield is annualised; the Finanzagentur defines
# the break-even as a simple yield difference, so it is subtracted. The
# result lands within a few hundredths of a point of the 2046's own traded
# real yield, the rest being a 30-year nominal leg against a 19.6-year
# inflation leg. The survey is still fetched, as the cross-check; the
# safe rate rests on the break-even because it is a price.
#
# AAA rather than all euro area government bonds, which yielded 0.56 points
# more at the same maturity on 8 September 2026. That spread is compensation for a government not
# paying, equation (4) cannot represent default risk, and booking it as a
# risk-free return would raise this rate and lower the recommendation while
# looking prudent. An Italian household buying BTP is NOT holding this asset.
#
# It is euro area HICP, not Italian. An Italian household's cost of living is
# Italian, and only BTP Italia tracks that, at five years and retail.
real_risk_free = 0.014709

# FIXED, not re-measured: Choi's estimator, the annualised standard
# deviation of monthly log returns, on MSCI All Country World in euro from
# January 2001 to August 2026, run from every day of the month and
# averaged (tools/italy_volatility.py). Month-end alone gives 13.99%, the
# lowest of the 28 days, because the 2008 and 2020 crashes each fell across
# two month-ends. A trailing five-year window moved the answer about nine
# points in five weeks when the 2020 crash left it. Priced in euro, so it
# carries the currency exposure of an unhedged world fund.
stock_volatility = 0.164545

as_of = 2026-09-08

