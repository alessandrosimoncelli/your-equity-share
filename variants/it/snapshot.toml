[market]

# BUILT HERE, by the construction variants/us/market_data.toml uses, because that
# construction carries no horizon and this model prices a lifetime.
#   dividend yield         0.015339   MSCI ACWI, euro, trailing over today's price
#   real growth per share  0.022860   100 year OLS trend through Shiller
#   repricing              0.000000   ratios held constant, stated
#   compound               0.038198
#   volatility             0.138942
#   arithmetic             0.048268   + volatility drag
#
# WHY NOT AQR'S PUBLISHED FIGURE, which this file used until September 2026 and
# which is still fetched and reported as the cross-check. Because they say what
# it is for, and it is not this:
#
#   "We present local real (inflation-adjusted) and nominal annual compound
#   rates of return for a horizon of 5 to 10 years. Over such intermediate
#   horizons, starting valuations tend to be useful inputs. For multi-decade
#   forecast horizons their impact is diluted, so theory and long-term
#   historical averages may matter more in judging expected returns."
#
# Both halves of their estimate are built to ten years rather than to thirty.
# The payout half uses "a country-specific estimate of next-10-year real EPS
# growth". The earnings half multiplies the cyclically adjusted earnings yield
# by 1 + (g x 5) explicitly "to account for earnings growth during the 10-year
# window". It is a good ten-year number being asked to do a different job.
#
# THIS CONSTRUCTION CARRIES NO HORIZON AT ALL. A current yield plus a long-run
# growth rate with no repricing is the same number at ten years or at thirty,
# because nothing in it is a forecast of when anything happens. That is the
# property a lifetime model needs, and it is why the two variants can now be
# read against each other: they differ by country, not by horizon and not by
# method.
#
# IT IS ALSO THE ONE THAT WINS AT THIRTY YEARS, measured rather than asserted.
# Table 7 of the American methodology backtests every candidate against the
# return that actually arrived, at ten, twenty and thirty years. This one has
# the lowest error at thirty, 2.25 against 3.31 for the trailing earnings
# yield, and LOSES at ten and twenty. The estimator that is right here is
# specifically the long-horizon one.
#
# THE YIELD IS MEASURED, from MSCI's own index levels. The gross index
# reinvests dividends and the price index does not, so the gap between their
# monthly returns is that month's dividend, and twelve of those over today's
# price are a trailing yield. Over TODAY's price, which is the denominator
# Shiller's column already has and therefore the one the American variant
# divides by: the three plausible denominators differ by a third of a point.
#
# GROSS of withholding tax, for that same reason. Withholding costs 0.34
# points, recorded below as dividend_yield_withheld, and an American holding
# domestic stock pays none of it. It is a real cost of a global sleeve that
# this model does not represent, written down rather than netted off, because
# netting it into a market return would hide a tax inside a price.
#
# THE GROWTH TERM IS THE AMERICAN ONE, unchanged, and that is the deviation
# this line has to argue for. AQR publish both halves themselves, 2.7% real EPS
# growth for United States large cap against 2.6% for Global All Country, a
# tenth of a point apart. Long-run real growth in earnings per share is a
# return on retained capital net of issuance, not a national characteristic.
# And the alternative was tried: tools/global_growth.py rebuilds it from 155
# years of data across eighteen countries and the answer moves 4.5 points
# across weighting schemes that are equally defensible.
#
# THE CHECK STILL RUNS. AQR's two halves are compared with ours on every
# refresh and both currently sit within a third of a point, which is a firm
# that does this for a living arriving at the same two numbers from their own
# data. tools/estimators_it.py sets the whole family side by side.
expected_stock_real_return = 0.048268

# The ECB's AAA euro area government curve at thirty years, deflated by the
# MARKET break-even inflation rate of the longest euro inflation-linked bond.
#
# It took three tries to get here and each attempt failed a different test.
#
# CONSTANT MATURITY. FRED's DFII30, which the American variant reads, is not a
# bond: it is the thirty-year point read off the TIPS curve every day, so it
# describes the same horizon at every refresh. This file used the traded real
# yield of Bund/euro-i 2046 until September 2026, and that bond has 19.6 years
# left and one fewer every year, so within a decade it would have been quoting
# a fifteen-year horizon under a thirty-year label.
#
# NO SURVEY. The curve was then deflated by the ECB Survey of Professional
# Forecasters, which fixed the maturity and introduced an opinion. This tool
# holds measurements and trends, not views.
#
# THE SAME KIND OF OBJECT. DFII30 is a traded real yield. A nominal yield with
# a forecast subtracted is not the same thing, whatever number it produces.
#
# A break-even clears all three. It is the rate at which holding the linker and
# holding a nominal bond pay the same, so it is a PRICE rather than a forecast,
# and subtracting it from a nominal curve recovers a real yield.
#
# THE CONSTRUCTION CHECKS AGAINST ITSELF AND PASSES. The break-even is derived
# from the 2046, so deflating a nominal yield by it should reproduce that bond's
# own traded real yield of 1.4906%. It lands at 1.4401%, four hundredths of a
# point away, and the residue is the maturity mismatch between a 30-year
# nominal leg and a 19.6-year inflation leg.
#
# THE SURVEY IS STILL FETCHED, as the cross-check, and sits 0.25 points ABOVE
# at 1.6903%. That gap is an inflation risk premium, which is what a holder
# pays to be rid of inflation risk. Deflating by the survey books that premium
# as return and makes the safe asset look better than any bond anyone can buy.
# It was worth 5.9 points of equity share, so it was not a rounding decision.
#
# AAA rather than all euro area government bonds, which yield 0.61 points more
# at the same maturity. That spread is compensation for a government not
# paying, equation (4) cannot represent default risk, and booking it as a
# risk-free return would raise this rate and lower the recommendation while
# looking prudent. An Italian household buying BTP is NOT holding this asset.
#
# It is euro area HICP, not Italian. An Italian household's cost of living is
# Italian, and only BTP Italia tracks that, at five years and retail.
real_risk_free = 0.014401

# Measured: five years of daily dividend-adjusted closes of VWCE.DE to
# 3 September 2026, annualised. Lower than the 17.18% of the S&P 500 sleeve,
# which is what diversifying across a world index is supposed to do, and it
# already carries the currency exposure a euro investor takes on an unhedged
# global fund, because the series is priced in euro.
stock_volatility = 0.138942
market_ticker = "VWCE.DE"

# After Italian tax: the pair the model reads by default. 12.5% on
# government bonds, 26% on other financial income, both levied on nominal
# income, 0.2% a year of stamp duty on each, equities deferred for 30 years.
# load_market_data(..., apply_tax=False) returns the figures before tax.
after_tax_expected_return = 0.037785
after_tax_real_risk_free = 0.007849

