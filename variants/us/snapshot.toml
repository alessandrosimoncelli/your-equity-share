# FROZEN. The market data variants/us/methodology.html was written with, kept so the document
# can be checked against the numbers it actually quotes. The tool reads
# market_data.toml, which refreshes; this file changes only when the
# document is rewritten against newer data. See variants/README.md.
# Its comments describe the pipeline as it was on that date, and it keeps
# keys the weekly refresh no longer writes, the estimates and checks the
# document quotes, which tools/verify_model.py and tools/analysis.py read. So
# a rewrite updates this file by hand rather than copying market_data.toml
# over it.

# Market data for Your Equity Share.
#
# Refresh with:  python update.py
#
# The model reads this file and never fetches anything itself, so an
# unreachable provider can never break a demonstration.
#
# See docs/inputs.md for what each number means.

[meta]
generated_at = "2026-09-07T22:19:07+00:00"
generated_by = "update.py"

# The three numbers the model uses. This section is required.
[market]

# What current valuation ratios imply if those ratios hold and
# growth matches its long-run average, which is Choi's own stated
# rationale for his 5% default. An ARITHMETIC mean, converted from
# the compound rate the building blocks produce.
#   dividend yield         0.0110
#   real growth per share  0.0229   100 year trend
#   repricing              0.0000   ratios held constant
#   compound               0.0341
#   arithmetic             0.0519   + volatility drag
# NOT counted as income: buybacks return a further
# 0.0153. Retiring shares is what makes earnings
# per share grow, so the growth term already carries them and
# adding them here would count them twice.
expected_stock_real_return = 0.051925

# FRED DFII30, the 30-year TIPS yield. A real yield
# already, so no inflation adjustment is applied. Reduce it by your
# marginal income tax rate if your bonds sit in a taxable account.
# Annualised from the semiannual quote, (1 + y/2)^2 - 1; the quote is
# recorded below as real_risk_free_quoted.
real_risk_free = 0.029819

# Fixed at Choi, Liu and Liu's 18.5%: the annualised standard
# deviation of monthly CRSP value-weighted log excess returns, July
# 1926 to July 2024 (paper, section 1.2). Not re-measured: a trailing
# window moves the answer whenever a crash enters or leaves it.
stock_volatility = 0.185000

as_of = 2026-09-03

# Where each number came from. The model does not read this section.
[provenance]
expected_return_method = "building blocks"
implied_erp = 0.040900
erp_as_of = 2026-09-01
expected_return_spread = 0.039558
expected_return_basis = "arithmetic mean, converted from compound"
expected_return_compound = 0.034077
expected_return_estimates = "building blocks 0.0341 (used); implied premium 0.0707; earnings anchor 0.0312; valuation regression, 30y 0.0532"
dividend_yield = 0.010966
real_growth = 0.022860
history_as_of = "2026-06-01"
history_source = "Shiller's own site"
volatility_source = "Choi, Liu and Liu (2025), section 1.2: 18.5%, monthly CRSP value-weighted log excess returns, July 1926 to July 2024, held fixed"
real_risk_free_source = "FRED DFII30"
real_risk_free_quoted = 0.029600
real_cash = 0.013679
buyback_yield_not_counted = 0.015292
expected_return_source = "dividend yield compounded with long-run real growth in earnings per share, no repricing; see variants/us/methodology.html section 3"
