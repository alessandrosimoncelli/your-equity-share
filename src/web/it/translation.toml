# The Italian page, written by tools/build_web.py from src/web/index.html.
#
# Each entry replaces one piece of the English page with its Italian
# version. `en` must appear exactly once in the page, ignoring how its words
# are wrapped across lines, and no two entries may overlap; the build stops
# otherwise. So an edit to the English that is not carried here fails the
# build instead of leaving English on the Italian page.
#
# Some entries are code rather than prose, because the page builds sentences
# in JavaScript. Their Italian keeps the same expressions, sometimes in a
# different order, and stays valid JavaScript.

# --- head -------------------------------------------------------------------

