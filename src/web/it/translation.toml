[[t]]
en = '''pct2.format(Number($("mu").value)) + " compound";'''
it = '''pct2.format(Number($("mu").value)) + " composto";'''

[[t]]
en = '''`That is <b>${pct2.format(expected)}</b> as an arithmetic mean, which is what ` +
    `the model uses; the difference is the volatility drag. ` +
    `The fetched figure is ${pct2.format(compoundShown())} compound.`'''
it = '''`Come media aritmetica, che è ciò che usa il modello, è <b>${pct2.format(expected)}</b>; ` +
    `la differenza è la correzione per la volatilità. ` +
